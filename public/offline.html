<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Arithmetica - Offline</title
  ><style>
    @font-face {
      font-family: Figtree;
      src: url('/fonts/figtree-variable.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }
    body {
      background: #1a1a1a;
      color: #eeefe7;
      font:
        17px Figtree,
        -apple-system,
        system-ui,
        sans-serif;
      display: grid;
      place-items: center;
      min-height: 90vh;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 30px;
    }
    h1 {
      font-size: 32px;
      font-weight: 550;
      letter-spacing: -0.04em;
    }
    p {
      color: #adb1a3;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background: #e7e9df;
      color: #20231b;
      text-decoration: none;
      border-radius: 6px;
      padding: 15px 26px;
    }
    a:focus-visible {
      outline: 2px solid #e9e8e1;
      outline-offset: 4px;
    }
  </style>
  <main>
    <img src="/icon.svg" width="64" height="64" alt="Arithmetica" />
    <h1>Reconnect to Arithmetica.</h1>
    <p>
      Arithmetica needs a connection to save attendance and notes. No offline changes have been
      recorded. Please reconnect and try again.
    </p>
    <a href="/">Try again</a>
  </main>
</html>
